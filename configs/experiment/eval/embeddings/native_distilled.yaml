# @package _global_
#
# Embedding eval (knn / linear-probe / zero-shot) for native distilled ALOE
# students loaded from explicit local-checkpoint backbone configs.
#
# Usage:
#
#   pixi run python scripts/eval.py #       experiment=eval/embeddings/native_distilled #       model/backbone@backbone.student=siglip2/aloe_siglip2_base_local_weights

defaults:
  - /experiment/eval/embeddings/native_distilled_base
  - /model/backbone@backbone.student: siglip2/aloe_siglip2_base_local_weights

tags: ["eval", "native", "distilled", "local_checkpoint"]

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      data/dataset: imagenet1k
      model/backbone@backbone.student: siglip2/aloe_siglip2_base_local_weights
