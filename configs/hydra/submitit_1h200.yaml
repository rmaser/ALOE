# @package _global_
defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  callbacks:
    log_job_return:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback
  launcher:
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    partition: "gpu1"
    timeout_min: 1440
    # timeout_min: 360
    cpus_per_task: 12
    tasks_per_node: 1
    gres: "gpu:h200:1"
    mem_per_cpu: null
    mem_per_gpu: null
    mem_gb: 150
    nodes: 1
    name: ${hydra.job.name}
    signal_delay_s: 120
    max_num_timeout: 3
    additional_parameters: {}
    array_parallelism: 16
    setup:
      - cd ${oc.env:PIXI_PROJECT_ROOT,${oc.env:PWD}}
      - eval "$(pixi shell-hook)"
