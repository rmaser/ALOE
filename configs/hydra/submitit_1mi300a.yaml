# @package _global_
# Viper-GPU: 1x AMD MI300A APU, shared node
# 24 CPU cores, 128 GB HBM3 per APU
defaults:
  - override /hydra/launcher: submitit_slurm

hydra:
  callbacks:
    log_job_return:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback
  launcher:
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    timeout_min: 1440
    cpus_per_task: 24
    tasks_per_node: 1
    gres: "gpu:1"
    constraint: "apu"
    mem_gb: null
    mem_per_cpu: null
    mem_per_gpu: null
    additional_parameters:
      mem: "110000"
    nodes: 1
    name: ${hydra.job.name}
    signal_delay_s: 120
    max_num_timeout: 3
    array_parallelism: 16
    setup:
      - export SLURM_CPU_BIND=none
      - cd ${oc.env:PIXI_PROJECT_ROOT,${oc.env:PWD}}
      - eval "$(pixi shell-hook -e rocm)"
