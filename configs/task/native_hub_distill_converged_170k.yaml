# @package _global_
#
# Same long-run trainer / optimizer / data / ``resume_slurm`` as ``distill_converged_170k``,
# but **no** ``model:`` subtree. Use with root ``config.yaml`` (includes
# ``/experiment/native/_distill_hf_native``), which composes ``objective/aloe_distill``
# for the distillation loss. Set
# ``model.cfg.distillation_layers`` in the experiment **body** (Hydra replaces the whole
# ``model`` node when you override the preset, which would drop layers from a shared task).
#
# Pair with ``override /scheduler: aloe_scheduler`` (see ``configs/scheduler/aloe_scheduler.yaml``).
#

defaults:
  - override /optimizer: adamw

trainer:
  max_epochs: -1
  max_steps: 170000
  check_val_every_n_epoch: null

optimizer:
  lr: 0.0003 # v2 needs lower lr (0.00003) than v1 (0.0003)
  weight_decay: 0.0

data:
  batch_size: 1024

resume_slurm: true
