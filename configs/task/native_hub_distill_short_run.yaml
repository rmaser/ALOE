# @package _global_
#
# Shared trainer / optimizer / data chunk for ``experiment=native_siglip2/*`` presets.
# Composed via ``/task/native_hub_distill_train`` (do not reference this alone from
# experiments unless you intentionally skip the Hydra default overrides).
#

defaults:
  - override /optimizer: adamw

trainer:
  max_epochs: -1
  max_steps: 30000
  check_val_every_n_epoch: null

optimizer:
  lr: 0.00003
  weight_decay: 0.0

data:
  batch_size: 1024
  transform:
    image_processor_trust_remote_code: true
    is_bcos: false

resume_slurm: false
